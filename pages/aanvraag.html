  <style>
    .font-display {

    .rainbow-border-btn {
      position: relative;
      background: #fff;
    }
    .rainbow-border-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 2px;
      background: linear-gradient(90deg, #f43f5e, #f97316, #eab308, #22c55e, #3b82f6, #8b5cf6, #ec4899);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    .rainbow-top-border {
      border-top: 2px solid transparent;
      border-image: linear-gradient(90deg, #f43f5e, #f97316, #eab308, #22c55e, #3b82f6, #8b5cf6, #ec4899) 1;
    }
    .rainbow-fill-btn {
      background: linear-gradient(90deg, #f43f5e, #f97316, #eab308, #22c55e, #3b82f6, #8b5cf6, #ec4899);

<body class="font-sans text-gray-700 bg-white">

  <!-- Content-load error notice (shown only if site-text-content.js fails to load) -->
  <div id="content-error-overlay" class="hidden fixed inset-0 z-[110] bg-white/95 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white border rounded-2xl shadow-lg max-w-sm w-full p-6 text-center">
      <p class="text-3xl mb-3">🎨</p>
      <h2 class="font-display text-2xl text-pink-600 mb-2" data-error-config="titel"></h2>
      <p class="text-sm text-gray-500" data-error-config="tekst"></p>
    </div>
  </div>
  <!-- Header -->
  <header id="site-header" class="sticky top-0 bg-white/90 backdrop-blur border-b border-transparent z-50">
    <div class="max-w-5xl mx-auto flex items-center justify-between px-4 py-6 flex-wrap gap-3">
      <a href="../index.html" class="flex flex-col items-center gap-1">
        <img id="logo-img" src="../assets/logo.jpg" alt="Pretty Colours Facepaint" class="h-28 w-28 rounded-full object-cover transition-all duration-500 ease-in-out">
        <p id="logo-tagline" class="text-[10px] tracking-widest mt-1 overflow-hidden">SCHMINK &amp; GLITTERTATTOO'S</p>
      </a>
      <nav class="flex items-center gap-6 text-sm">
        <a href="../index.html" class="text-pink-600 hover:underline hover:underline-offset-4">Home</a>
        <a href="../pages/aanvraag.html" class="rainbow-border-btn text-black hover:bg-gray-50 rounded-full transition cursor-pointer px-7 py-3.5 font-medium"><span data-config="contact.callToAction"></span></a>
      </nav>
    </div>
  </header>
  <!-- Contact form -->
  <section id="contact" class="max-w-lg mx-auto px-4 py-16">
    <a href="../index.html" class="text-sm text-pink-600 font-normal">&larr; Terug</a>
    <h1 class="font-display text-3xl text-center mt-6 mb-2 text-pink-600"><span data-config="aanvraag.titel"></span></h1>
    <p class="text-gray-500 text-center text-sm mb-8"><span data-config="aanvraag.intro"></span></p>

    <form id="contact-form" action="https://api.staticforms.dev/submit" method="POST" class="bg-white border rounded-2xl shadow-sm p-6 space-y-4">
      <input type="hidden" name="subject" value="pretty-colours-facepaint submission">
      <!-- Honeypot field for spam protection -->
      <input type="text" name="honeypot" class="hidden" tabindex="-1" autocomplete="off">

      <div>
        <label for="name" class="block text-sm font-medium mb-1"><span data-config="aanvraag.labelNaam"></span></label>
        <input type="text" id="name" name="name" required class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-pink-400">
      </div>

      <div>
        <label for="email" class="block text-sm font-medium mb-1"><span data-config="aanvraag.labelEmail"></span></label>
        <input type="email" id="email" name="email" required class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-pink-400">
      </div>

      <div>
        <label for="eventDate" class="block text-sm font-medium mb-1"><span data-config="aanvraag.labelDatum"></span></label>
        <input type="date" id="eventDate" name="eventDate" class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-pink-400">
      </div>

      <div>
        <label for="message" class="block text-sm font-medium mb-1"><span data-config="aanvraag.labelBericht"></span></label>
        <textarea id="message" name="message" rows="5" required class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-pink-400"></textarea>
      </div>

      <button type="submit" class="rainbow-fill-btn text-white shadow hover:opacity-90 rounded-full transition cursor-pointer w-full py-4 font-semibold"><span data-config="aanvraag.knop"></span></button>
      <p id="form-status" class="text-sm text-center"></p>
    </form>
  </section>

  <!-- Footer -->
  <footer class="rainbow-top-border">
    <div class="max-w-5xl mx-auto px-4 py-10 flex flex-col sm:flex-row items-center justify-between gap-10 text-sm text-gray-500">
      <div class="flex items-center gap-3">
        <img src="../assets/logo.jpg" alt="Pretty Colours Facepaint" class="h-12 w-12 rounded-full object-cover">
        <p class="font-display text-base text-pink-500"><span data-config="footer.contact.tagline"></span></p>
      </div>
      <div class="space-y-3 text-center sm:text-left">
        <p class="flex items-center justify-center sm:justify-start gap-2.5">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4 shrink-0 text-pink-500">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 0 0 2.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 0 1-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 0 0-1.091-.852H4.5A2.25 2.25 0 0 0 2.25 4.5v2.25Z" />
          </svg>
          <span data-config="footer.contact.telefoon"></span>
        </p>
        <p class="flex items-center justify-center sm:justify-start gap-2.5">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="shrink-0 size-4 text-pink-500">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
          </svg>
          <span data-config="footer.contact.email"></span>
        </p>
        <p class="flex items-center justify-center sm:justify-start gap-2.5">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4 shrink-0 text-pink-500">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
          </svg>
          <span data-config="footer.contact.regio"></span>
        </p>
      </div>
      <div class="flex gap-4">
        <div data-social-badges class="contents"></div>
      </div>
    </div>
  </footer>
  <script src="../assets/error-content.js"></script>
