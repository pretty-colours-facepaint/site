<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aanvraag doen — Pretty Colours Facepaint</title>
  <meta name="description" content="Vraag vrijblijvend schminken of glittertattoo's aan voor je kinderfeestje, evenement of bedrijf rond Hoofddorp.">
  <link rel="canonical" href="https://prettycolours-facepaint.nl/aanvraag.html">
  <meta name="robots" content="index, follow">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Aanvraag doen — Pretty Colours Facepaint">
  <meta property="og:description" content="Vraag vrijblijvend schminken of glittertattoo's aan voor je kinderfeestje, evenement of bedrijf rond Hoofddorp.">
  <meta property="og:url" content="https://prettycolours-facepaint.nl/aanvraag.html">
  <link rel="icon" href="assets/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .font-display {
      font-family: 'Pacifico', cursive;
    }
    .rainbow-border-btn {
      position: relative;
      background: #fff;
    }
    .rainbow-border-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 2px;
      background: linear-gradient(90deg, #f43f5e, #f97316, #eab308, #22c55e, #3b82f6, #8b5cf6, #ec4899);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
  </style>
</head>
<body class="font-sans text-gray-700 bg-white">

  <header class="sticky top-0 bg-white/90 backdrop-blur border-b z-50">
    <div class="max-w-5xl mx-auto flex items-center justify-between px-4 py-6 flex-wrap gap-3">
      <a href="index.html" class="flex flex-col items-center gap-1">
        <img id="logo-img" src="assets/logo.jpg" alt="Pretty Colours Facepaint" class="h-28 w-28 rounded-full object-cover transition-all duration-500 ease-in-out">
        <p id="logo-tagline" class="text-[10px] tracking-widest text-gray-400 mt-1 overflow-hidden">SCHMINK &amp; GLITTERTATTOO'S</p>
      </a>
      <nav class="flex items-center gap-6 text-sm">
        <a href="index.html#werk" class="hover:text-pink-600">Bekijk mijn werk</a>
        <a href="index.html#over" class="hover:text-pink-600">Over mij</a>
        <a href="aanvraag.html" class="border border-pink-300 text-pink-600 rounded-full px-5 py-2.5 font-medium hover:bg-pink-50">AANVRAAG DOEN</a>
      </nav>
    </div>
  </header>
  <!-- Contact form -->
  <section id="contact" class="max-w-lg mx-auto px-4 py-16">
    <a href="index.html" class="text-sm text-pink-600 font-medium">&larr; Terug naar home</a>
    <h1 class="font-display text-3xl text-center mt-6 mb-2 text-pink-600">Aanvraag doen</h1>
    <p class="text-gray-500 text-center text-sm mb-8">Vul het formulier in en ik neem contact met je op over je feest of evenement.</p>

    <form id="contact-form" action="https://api.staticforms.dev/submit" method="POST" class="bg-white border rounded-2xl shadow-sm p-6 space-y-4">
      <input type="hidden" name="subject" value="pretty-colours-facepaint submission">
      <!-- Honeypot field for spam protection -->
      <input type="text" name="honeypot" class="hidden" tabindex="-1" autocomplete="off">

      <div>
        <label for="name" class="block text-sm font-medium mb-1">Naam</label>
        <input type="text" id="name" name="name" required class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-pink-400">
      </div>

      <div>
        <label for="email" class="block text-sm font-medium mb-1">E-mail</label>
        <input type="email" id="email" name="email" required class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-pink-400">
      </div>

      <div>
        <label for="eventDate" class="block text-sm font-medium mb-1">Datum evenement</label>
        <input type="date" id="eventDate" name="eventDate" class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-pink-400">
      </div>

      <div>
        <label for="message" class="block text-sm font-medium mb-1">Bericht</label>
        <textarea id="message" name="message" rows="5" required class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-pink-400"></textarea>
      </div>

      <button type="submit" class="w-full bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 text-white font-semibold py-3 rounded-full hover:opacity-90 transition">Verstuur aanvraag</button>
      <p id="form-status" class="text-sm text-center"></p>
    </form>
  </section>

  <!-- Footer -->
  <footer class="border-t">
    <div class="max-w-5xl mx-auto px-4 py-8 flex flex-col sm:flex-row items-center justify-between gap-6 text-sm text-gray-500">
      <div class="flex items-center gap-3">
        <img src="assets/logo.jpg" alt="Pretty Colours Facepaint" class="h-12 w-12 rounded-full object-cover">
        <p class="font-display text-base text-pink-500">Kleur maakt alles leuker!</p>
      </div>
      <div class="space-y-1 text-center sm:text-left">
        <p>📞 06 – 12345678</p>
        <p>✉ info@voorbeeld.nl</p>
        <p>📍 30 km rond Hoofddorp</p>
      </div>
      <div class="flex gap-3">
        <span class="w-9 h-9 rounded-full bg-pink-500 text-white flex items-center justify-center text-xs">IG</span>
        <span class="w-9 h-9 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs">FB</span>
        <a href="aanvraag.html" class="w-9 h-9 rounded-full bg-purple-500 text-white flex items-center justify-center text-xs">✉</a>
      </div>
    </div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
